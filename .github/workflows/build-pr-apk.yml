name: Build PR APK

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: notate-pr-${{ github.event.pull_request.number }}
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Post APK link comment
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: apk-build
        message: |
          ## 📦 APK Build

          The debug APK for this PR has been built successfully!

          **[⬇️ Download APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**

          > Download the artifact `notate-pr-${{ github.event.pull_request.number }}` from the **Artifacts** section at the bottom of the linked page.

          _Built from commit ${{ github.event.pull_request.head.sha }}_
